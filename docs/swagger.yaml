host: api.hypeatlas.app
info:
  contact: {}
  description: Relay (HypeMap), Signal (MetaLens) y Comps & Leagues.
  title: HypeAtlas API
  version: "1.0"
paths:
  /v1/hypemap/live:
    get:
      parameters:
      - description: val|lol
        in: query
        name: game
        type: string
      - description: es|en|fr|pt
        in: query
        name: lang
        type: string
      - default: 50
        description: 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: paginación
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_relay_infra_http.HypeMapLiveResp'
      summary: 'HypeMap: co-streams en vivo (ranking)'
      tags:
      - relay
  /v1/hypemap/summary:
    get:
      parameters:
      - description: val|lol
        in: query
        name: game
        type: string
      - description: es|en|fr|pt
        in: query
        name: lang
        type: string
      - default: 20
        description: 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: paginación
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_relay_infra_http.HypeMapSummaryResp'
      summary: 'HypeMap: resumen por evento (agregado)'
      tags:
      - relay
  /v1/ingest/relay/costreams:upsert:
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/modules_relay_infra_http.upsertCoStreamReq'
      responses:
        "204":
          description: no content
        "400":
          description: bad json
          schema:
            type: string
        "500":
          description: db error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 'Ingest: upsert co-stream'
      tags:
      - ingest
  /v1/ingest/signal/comps:upsert:
    post:
      consumes:
      - application/json
      parameters:
      - description: payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/modules_signal_infra_http.upsertCompReq'
      responses:
        "204":
          description: no content
        "400":
          description: bad json
          schema:
            type: string
        "500":
          description: db error
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Upsert de composición (ingesta)
      tags:
      - ingest
  /v1/relay/costreams:
    get:
      parameters:
      - description: Slug o ID del evento (ej. vct-emea-final)
        in: query
        name: event_id
        required: true
        type: string
      - description: Filtro por idioma (ej. es)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_relay_infra_http.CoStreamsResp'
        "400":
          description: event_id required
          schema:
            type: string
      summary: Listar co-streams en vivo de un evento
      tags:
      - relay
  /v1/relay/events:
    get:
      parameters:
      - description: val|lol
        in: query
        name: game
        type: string
      - description: Filtrar por liga
        in: query
        name: league
        type: string
      - description: upcoming|live|past
        in: query
        name: status
        type: string
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_steven230500_hypeatlas-api_shared_http.PaginatedResponse'
        "500":
          description: error
          schema:
            type: string
      summary: Listar eventos
      tags:
      - relay
    post:
      consumes:
      - application/json
      parameters:
      - description: Event data
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/github_com_steven230500_hypeatlas-api_domain_entities.Event'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_steven230500_hypeatlas-api_domain_entities.Event'
        "400":
          description: validation error
          schema:
            type: string
      summary: Crear evento
      tags:
      - relay
  /v1/relay/events/{slug}:
    delete:
      parameters:
      - description: Event slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: error
          schema:
            type: string
      summary: Eliminar evento
      tags:
      - relay
    get:
      parameters:
      - description: Event slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_steven230500_hypeatlas-api_domain_entities.Event'
        "404":
          description: event not found
          schema:
            type: string
      summary: Obtener evento por slug
      tags:
      - relay
    put:
      consumes:
      - application/json
      parameters:
      - description: Event slug
        in: path
        name: slug
        required: true
        type: string
      - description: Fields to update
        in: body
        name: updates
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: validation error
          schema:
            type: string
      summary: Actualizar evento
      tags:
      - relay
  /v1/signal/champions:
    get:
      parameters:
      - description: Versión del juego (ej. 14.14.1)
        in: query
        name: version
        type: string
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_steven230500_hypeatlas-api_shared_http.PaginatedResponse'
        "400":
          description: error
          schema:
            type: string
      summary: Listar campeones
      tags:
      - signal
  /v1/signal/changes:
    get:
      parameters:
      - description: lol | val
        enum:
        - lol
        - val
        in: query
        name: game
        required: true
        type: string
      - description: 'Ej: 14.14 | 9.15'
        in: query
        name: version
        required: true
        type: string
      - description: agent|champion|item|weapon|map
        enum:
        - agent
        - champion
        - item
        - weapon
        - map
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_signal_infra_http.ChangesResp'
        "400":
          description: game and version required
          schema:
            type: string
      summary: Listar cambios de un parche
      tags:
      - signal
  /v1/signal/comps:
    get:
      parameters:
      - description: lol | val
        enum:
        - lol
        - val
        in: query
        name: game
        required: true
        type: string
      - description: EMEA
        in: query
        name: region
        required: true
        type: string
      - description: LEC
        in: query
        name: league
        type: string
      - description: 14.14 | 9.15
        in: query
        name: patch
        required: true
        type: string
      - description: Ascent (solo VAL)
        in: query
        name: map
        type: string
      - description: 'LoL: blue/red | VAL: attack/defense'
        enum:
        - blue
        - red
        - attack
        - defense
        in: query
        name: side
        type: string
      - default: 50
        description: 1-100
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_signal_infra_http.CompsResp'
        "400":
          description: game, region and patch required
          schema:
            type: string
      summary: Listar composiciones (LoL/VAL) filtradas
      tags:
      - signal
  /v1/signal/leagues:
    get:
      parameters:
      - description: lol | val
        enum:
        - lol
        - val
        in: query
        name: game
        required: true
        type: string
      - description: EMEA | APAC | AMERICAS
        enum:
        - EMEA
        - APAC
        - AMERICAS
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_signal_infra_http.LeaguesResp'
        "400":
          description: game required
          schema:
            type: string
      summary: Listar ligas por juego y región
      tags:
      - signal
  /v1/signal/patches:
    get:
      parameters:
      - description: lol | val
        enum:
        - lol
        - val
        in: query
        name: game
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modules_signal_infra_http.PatchesResp'
        "400":
          description: game required
          schema:
            type: string
      summary: Listar parches por juego
      tags:
      - signal
  /v1/signal/regions:
    get:
      parameters:
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_steven230500_hypeatlas-api_shared_http.PaginatedResponse'
        "500":
          description: error
          schema:
            type: string
      summary: Listar regiones disponibles
      tags:
